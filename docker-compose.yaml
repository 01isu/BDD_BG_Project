services:

  # =========================================
  # PostgreSQL : base de données interne d'Airflow
  # =========================================
  postgres:
    image: postgres:13
    container_name: sneakers_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # =========================================
  # Airflow Init : initialise la base + crée l'utilisateur admin
  # Ce service tourne UNE fois puis s'arrête
  # =========================================
  airflow-init:
    build: .
    container_name: sneakers_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=zp8kVfTYx4z0_5gW1uH3qP9NjL2mB6rC8sD0aE5xF7g=
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    command: version
    volumes:
      - ./tmp/dags:/opt/airflow/dags
      - ./tmp/data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs

  # =========================================
  # Airflow Webserver : l'interface UI sur http://localhost:8080
  # =========================================
  airflow-webserver:
    build: .
    container_name: sneakers_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=zp8kVfTYx4z0_5gW1uH3qP9NjL2mB6rC8sD0aE5xF7g=
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - RAPIDAPI_HOST=${RAPIDAPI_HOST}
      - ELASTIC_HOST=http://elasticsearch:9200
    volumes:
      - ./tmp/dags:/opt/airflow/dags
      - ./tmp/data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always

  # =========================================
  # Airflow Scheduler : exécute les DAGs aux moments programmés
  # =========================================
  airflow-scheduler:
    build: .
    container_name: sneakers_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=zp8kVfTYx4z0_5gW1uH3qP9NjL2mB6rC8sD0aE5xF7g=
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - RAPIDAPI_HOST=${RAPIDAPI_HOST}
      - ELASTIC_HOST=http://elasticsearch:9200
    volumes:
      - ./tmp/dags:/opt/airflow/dags
      - ./tmp/data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
    restart: always

  # =========================================
  # Elasticsearch : stockage de l'index final pour Kibana
  # =========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: sneakers_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      retries: 10
    restart: always

  # =========================================
  # Kibana : dashboard de visualisation sur http://localhost:5601
  # =========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: sneakers_kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    restart: always

# =========================================
# Volumes nommés (persistants)
# =========================================
volumes:
  postgres-data:
  airflow-logs:
  es-data: